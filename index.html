<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="theme-color" content="#1e120a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Échecs">
  <title>Échecs</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="preload" href="fonts/PixelifySans.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- ================= ACCUEIL ================= -->
  <section id="home" class="screen active">
    <div class="home-top">
      <div class="online"><i class="led"></i><span id="onlineCount">12 483</span> en ligne</div>
      <button id="homeSoundBtn" class="sq-btn" aria-label="Son"><img id="homeSoundIcon" alt=""></button>
    </div>

    <h1 class="wordmark"><img id="wordmark" alt="Échecs"></h1>

    <!-- carte joueur sur tapis de feutre -->
    <div class="hero felt">
      <button class="hero-av" id="meAvatarBtn" aria-label="Modifier le profil">
        <img class="av" id="meAvatarHome" alt="">
        <span class="edit-dot"><img data-icon="pencil" alt=""></span>
      </button>
      <div class="hero-name"><img class="flag" id="meFlagHome" alt=""><span id="meNameHome"></span></div>
      <div class="hero-rank" id="meRankRow"><img id="meBadge" class="badge" alt=""><span id="meRank"></span></div>
      <div class="hero-elo"><span id="meElo">800</span><small>ELO</small></div>
      <div class="xp">
        <div class="xp-bar"><i id="xpFill"></i></div>
        <div class="xp-txt"><span id="xpLeft"></span><span id="xpRight"></span></div>
      </div>
      <canvas id="spark" width="120" height="30"></canvas>
    </div>

    <div class="stats-row">
      <div class="stat s-w"><b id="stW">0</b><span>Victoires</span></div>
      <div class="stat s-d"><b id="stD">0</b><span>Nulles</span></div>
      <div class="stat s-l"><b id="stL">0</b><span>Défaites</span></div>
      <div class="stat s-p"><b id="stPeak">0</b><span>Record</span></div>
    </div>

    <button id="historyBtn" class="last-games">
      <span class="lg-title">Dernières parties</span>
      <span class="lg-dots" id="lastDots"></span>
      <span class="lg-more">›</span>
    </button>

    <!-- étagère décorative -->
    <div class="shelf" id="shelf"></div>

    <div class="play-zone">
      <button id="resumeBtn" class="resume hidden">
        <img data-icon="sword" alt="">
        <div><b>Reprendre la partie</b><small id="resumeInfo"></small></div>
        <span class="lg-more">›</span>
      </button>

      <div class="chips" id="tcChips"></div>

      <button id="rankedBtn" class="btn green big-btn"><img data-icon="sword" alt="">Jouer classé</button>
      <button id="friendlyBtn" class="btn blue"><img data-icon="heart" alt="">Partie amicale</button>
    </div>
  </section>

  <!-- ================= RECHERCHE ================= -->
  <section id="search" class="screen">
    <div class="search-box">
      <div class="spinner" id="spinner"></div>
      <h2 id="searchTitle">Recherche d'un adversaire…</h2>
      <p id="searchSub" class="muted"></p>
      <div class="versus hidden" id="versus">
        <div class="vs-card"><img id="vsMeAv" class="av" alt=""><b id="vsMeName"></b><span id="vsMeElo"></span></div>
        <div class="vs">VS</div>
        <div class="vs-card"><img id="vsOppAv" class="av" alt=""><b id="vsOppName"></b><span id="vsOppElo"></span></div>
      </div>
      <button id="cancelSearch" class="btn wood small">Annuler</button>
    </div>
  </section>

  <!-- ================= PARTIE ================= -->
  <section id="game" class="screen">
    <div class="topbar">
      <button id="backBtn" class="sq-btn" aria-label="Menu"><img data-icon="back" alt=""></button>
      <div class="mode" id="modeLabel"></div>
      <button id="soundBtn" class="sq-btn" aria-label="Son"><img id="soundIcon" alt=""></button>
    </div>

    <div class="player-bar opp">
      <img class="av" id="oppAv" alt="">
      <div class="pinfo">
        <div class="pline"><img class="flag" id="oppFlag" alt=""><b id="oppName"></b><span class="elo" id="oppElo"></span><img class="badge sm" id="oppBadge" alt=""></div>
        <div class="captured" id="oppCaptured"></div>
      </div>
      <div class="clock" id="oppClock">--:--</div>
      <div class="bubble hidden" id="bubble"></div>
      <div class="dots" id="thinking"><i></i><i></i><i></i></div>
    </div>

    <div class="board-wrap" id="boardWrap">
      <img id="boardImg" class="board-img" alt="">
      <div id="board" class="board"></div>
      <div id="promo" class="promo hidden"></div>
      <div id="fx" class="fx"></div>
    </div>

    <div class="player-bar me">
      <img class="av" id="meAv" alt="">
      <div class="pinfo">
        <div class="pline"><img class="flag" id="meFlag" alt=""><b id="meName"></b><span class="elo" id="meEloGame"></span><img class="badge sm" id="meBadgeGame" alt=""></div>
        <div class="captured" id="meCaptured"></div>
      </div>
      <div class="clock" id="meClock">--:--</div>
    </div>

    <div class="moves" id="moves"></div>

    <div class="actions" id="actions">
      <button id="undoBtn"><img data-icon="undo" alt=""><span>Annuler</span></button>
      <button id="hintBtn"><img data-icon="bulb" alt=""><span>Indice</span></button>
      <button id="drawBtn"><img data-icon="hand" alt=""><span>Nulle</span></button>
      <button id="flipBtn"><img data-icon="flip" alt=""><span>Tourner</span></button>
      <button id="resignBtn"><img data-icon="flag" alt=""><span>Abandon</span></button>
    </div>
  </section>

  <!-- ================= FENÊTRES ================= -->
  <div id="resultModal" class="overlay hidden">
    <div class="panel paper card">
      <div class="ribbon" id="resultRibbon"></div>
      <p id="resultText" class="ink"></p>
      <div class="elo-change hidden" id="eloChange">
        <img id="resBadge" class="badge" alt="">
        <span class="elo-num" id="resElo"></span>
        <span class="delta" id="resDelta"></span>
      </div>
      <p class="rankup hidden" id="rankUp"></p>
      <button id="rematchBtn" class="btn green">Revanche</button>
      <button id="newGameBtn" class="btn wood">Nouvel adversaire</button>
      <div class="row2">
        <button id="reviewBtn" class="link">Voir l'échiquier</button>
        <button id="homeBtn" class="link">Accueil</button>
      </div>
    </div>
  </div>

  <div id="confirmModal" class="overlay hidden">
    <div class="panel paper card">
      <h3 class="ink" id="confirmTitle"></h3>
      <p class="ink soft" id="confirmText"></p>
      <button id="confirmYes" class="btn red">Oui</button>
      <button id="confirmNo" class="btn wood">Non</button>
    </div>
  </div>

  <div id="friendlyModal" class="overlay hidden">
    <div class="panel paper card">
      <h3 class="ink">Partie amicale</h3>
      <p class="ink soft">Pas d'Elo en jeu. Annuler et indices autorisés.</p>
      <div class="opp-preview">
        <img class="av" id="frAv" alt="">
        <div><b class="ink" id="frName"></b><br><span class="ink soft" id="frRank"></span></div>
      </div>
      <div class="slider-row">
        <input type="range" id="frElo" min="200" max="3000" step="50">
        <span class="ink elo-tag" id="frEloVal"></span>
      </div>
      <div class="seg" id="frColor">
        <button data-c="w"><img alt="" data-piece="wk">Blancs</button>
        <button data-c="r">Hasard</button>
        <button data-c="b"><img alt="" data-piece="bk">Noirs</button>
      </div>
      <button id="frPlay" class="btn green">Jouer</button>
      <button id="frCancel" class="link">Fermer</button>
    </div>
  </div>

  <div id="historyModal" class="overlay hidden">
    <div class="panel paper card tall">
      <h3 class="ink">Historique</h3>
      <div id="recent" class="recent"></div>
      <button id="historyClose" class="btn wood">Fermer</button>
    </div>
  </div>

  <div id="profileModal" class="overlay hidden">
    <div class="panel paper card">
      <h3 class="ink" id="profileTitle">Ton profil</h3>
      <div class="av-edit">
        <img class="av big" id="pfAv" alt="">
        <button id="pfReroll" class="btn wood small">Autre tête</button>
      </div>
      <input id="pfName" class="input" maxlength="16" placeholder="Pseudo" autocomplete="off" autocapitalize="off" spellcheck="false">
      <div class="flag-pick" id="pfFlags"></div>
      <div id="pfLevel">
        <p class="ink soft">Ton niveau actuel ?</p>
        <div class="levels" id="pfLevels"></div>
      </div>
      <button id="pfSave" class="btn green">C'est parti</button>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
