<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="theme-color" content="#16181d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Échecs">
  <title>Échecs</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- ÉCRAN MENU -->
  <section id="menu" class="screen active">
    <header class="menu-head">
      <img src="pieces/wN.svg" alt="" class="logo">
      <div>
        <h1>Échecs</h1>
        <p class="sub">Entraîne-toi contre Stockfish</p>
      </div>
    </header>

    <button id="resumeBtn" class="resume hidden">
      <span>Reprendre la partie</span>
      <small id="resumeInfo"></small>
    </button>

    <h2>Choisis ton adversaire</h2>
    <div id="botList" class="bot-list"></div>

    <h2>Ta couleur</h2>
    <div class="seg" id="colorSeg">
      <button data-color="w" class="on"><img src="pieces/wK.svg" alt="">Blancs</button>
      <button data-color="r"><span class="dice">?</span>Hasard</button>
      <button data-color="b"><img src="pieces/bK.svg" alt="">Noirs</button>
    </div>

    <button id="playBtn" class="primary">Jouer</button>
  </section>

  <!-- ÉCRAN PARTIE -->
  <section id="game" class="screen">
    <div class="topbar">
      <button id="backBtn" class="icon-btn" aria-label="Menu">
        <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" /></svg>
      </button>
      <span class="status" id="status">À toi de jouer</span>
      <button id="soundBtn" class="icon-btn" aria-label="Son">
        <svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z" /><path id="soundWave" d="M16 9a4 4 0 010 6M18.5 6.5a8 8 0 010 11" /></svg>
      </button>
    </div>

    <div class="player opp">
      <div class="avatar" id="oppAvatar"></div>
      <div class="pinfo">
        <div class="pname"><span id="oppName"></span> <span class="elo" id="oppElo"></span></div>
        <div class="captured" id="oppCaptured"></div>
      </div>
      <div class="thinking" id="thinking"><i></i><i></i><i></i></div>
    </div>

    <div class="board-wrap">
      <div id="board" class="board"></div>
      <div id="promo" class="promo hidden"></div>
    </div>

    <div class="player me">
      <div class="avatar me-av" id="meAvatar"></div>
      <div class="pinfo">
        <div class="pname">Toi</div>
        <div class="captured" id="meCaptured"></div>
      </div>
    </div>

    <div class="moves" id="moves"></div>

    <div class="actions">
      <button id="undoBtn"><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5" /><path d="M4 9h10a6 6 0 010 12h-3" /></svg>Annuler</button>
      <button id="hintBtn"><svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 00-4 10.5c.8.8 1 1.5 1 2.5h6c0-1 .2-1.7 1-2.5A6 6 0 0012 3z" /></svg>Indice</button>
      <button id="flipBtn"><svg viewBox="0 0 24 24"><path d="M7 4v16M7 20l-3-3M7 20l3-3M17 20V4M17 4l-3 3M17 4l3 3" /></svg>Tourner</button>
      <button id="resignBtn"><svg viewBox="0 0 24 24"><path d="M5 21V4M5 4h11l-2 4 2 4H5" /></svg>Abandon</button>
    </div>
  </section>

  <!-- FIN DE PARTIE -->
  <div id="overlay" class="overlay hidden">
    <div class="card">
      <div class="result-icon" id="resultIcon"></div>
      <h3 id="resultTitle"></h3>
      <p id="resultText"></p>
      <button id="againBtn" class="primary">Rejouer</button>
      <button id="reviewBtn" class="ghost">Voir l'échiquier</button>
      <button id="menuBtn" class="ghost">Menu</button>
    </div>
  </div>

  <!-- CONFIRMATION -->
  <div id="confirm" class="overlay hidden">
    <div class="card">
      <h3 id="confirmTitle"></h3>
      <button id="confirmYes" class="primary danger">Oui</button>
      <button id="confirmNo" class="ghost">Non</button>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
